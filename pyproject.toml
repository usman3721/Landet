[tool.poetry]
name = "landet"
version = "1.1.0"
description = "Language Detection System built with FastAPI and DVC"
authors = ["Usman Hassan <olamidehassan007@gmail.com>"]
packages = [{include = "src"}]
package-mode = false  # ✅ Add this line

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.35.0"}
pandas = "^2.2.0"
scikit-learn = "^1.4.0"
dvc = {extras = ["s3"], version = "^3.0.0"}
mlflow = "^2.5.0"
redis = "^5.0.0"
python-jose = "^3.3.0"
flake8 = "^7.3.0"
numpy = "^2.3.3"
wordcloud = "^1.9.4"
nltk = "^3.9.2"
spacy = "^3.8.7"
seaborn = "^0.13.2"
prometheus-fastapi-instrumentator = "^7.1.0"


[tool.poetry.group.dev.dependencies]
pytest = "^8.0.0"
black = "^24.0.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
