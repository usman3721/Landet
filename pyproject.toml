[project]
name = "landet"
version = "1.1.0"
description = "Language Detection System built with FastAPI and DVC"
readme = "README.md"
authors = [{ name = "Usman Hassan", email = "olamidehassan007@gmail.com" }]
requires-python = ">=3.11,<3.14"

# Runtime: only what the API container needs.
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.35,<0.36",
    "pandas>=2.2,<3",
    "numpy>=2.3.3",
    "scikit-learn>=1.4,<2",
    "redis>=5,<6",
    "python-jose>=3.3,<4",   # consider PyJWT: python-jose has had security advisories
    "prometheus-fastapi-instrumentator>=7.1,<8",
    "prometheus-client>=0.23.1,<0.24",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.11",
    "pre-commit>=3.8",
]
# Verify with: grep -rE "import (mlflow|nltk|spacy)" src/
train = [
    "mlflow>=2.5,<3",
    "dvc[s3]>=3,<4",
    "nltk>=3.9.2",
    "spacy>=3.8.7",
]
notebooks = [
    "seaborn>=0.13.2",
    "wordcloud>=1.9.4",
    "ipykernel>=6.29",
]

[tool.uv]
package = false              # this is an app, not a library
default-groups = ["dev"]     # `uv sync` installs main + dev; add train/notebooks on request

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true