[project]
name = "landet"
version = "1.1.0"
description = "Language detection with scikit-learn, served by FastAPI"
readme = "README.md"
authors = [{ name = "Usman Hassan", email = "olamidehassan007@gmail.com" }]
requires-python = ">=3.11,<3.14"

# Runtime: only what the API container needs.
dependencies = [
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.35,<0.36",
    "pandas>=2.2,<3",
    "numpy>=2.3.3",
    "scikit-learn>=1.4,<2",
    "joblib>=1.4",
    "python-dotenv>=1.0",
    "redis>=5,<6",
    "python-jose>=3.3,<4",   # consider PyJWT: python-jose has had security advisories
]

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "ruff>=0.8",
    "pre-commit>=3.8",
]
# Evaluation plots and the notebook.
ml = [
    "matplotlib>=3.9",
    "seaborn>=0.13.2",
    "ipykernel>=6.29",
    "nbconvert>=7.16",
]

[tool.uv]
package = false                 # this is an app, not a library
default-groups = ["dev", "ml"]  # `uv sync` installs everything; Docker installs runtime only

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends"]
