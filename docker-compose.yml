version: '3.9'

services:
  api:
    build: .
    container_name: fastapi-app
    ports:
      - "8000:8000"
    environment:
      - API_KEY=demo-key
      - JWT_SECRET_KEY=secret
      - REDIS_URL=redis://redis:6379
      - MLFLOW_TRACKING_URI=http://mlflow:5000  # Add this
    depends_on:
      - redis
      - prometheus
      - mlflow  # Add this
    volumes:
      - ./models:/app/models  # Persist models
    networks:
      - backend

  redis:
    image: redis:alpine
    container_name: redis1
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data  # Persist Redis data
    networks:
      - backend

  # ADD MLflow service
  mlflow:
    image: mlflow/mlflow
    container_name: mlflow1
    ports:
      - "5000:5000"
    command: mlflow server --backend-store-uri sqlite:///mlflow.db --default-artifact-root ./mlruns --host 0.0.0.0
    volumes:
      - mlflow_data:/mlruns
    networks:
      - backend

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus  # Persist metrics
    ports:
      - "9090:9090"
    networks:
      - backend

  grafana:
    image: grafana/grafana:latest
    container_name: grafana1
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana  # Persist dashboards
    depends_on:
      - prometheus
    networks:
      - backend

volumes:
  redis_data:
  prometheus_data:
  grafana_data:
  mlflow_data:

networks:
  backend:
    driver: bridge