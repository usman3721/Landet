name: CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install Dependencies
        run: uv sync --locked

      - name: Check Linting
        run: uv run ruff check .

      - name: Check Formatting
        run: uv run ruff format --check .

      # Tests build their own tiny dataset, so CI needs no real data, model or Redis.
      - name: Run Tests
        run: uv run pytest

